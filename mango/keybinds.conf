# Key Bindings
# key name refer to `xev` or `wev` command output,
# mod keys name: super,ctrl,alt,shift,none

# reload config
bind=SUPER,r,reload_config

# menu and terminal
bind=Alt,space,spawn,rofi -show drun
bind=SUPER,Return,spawn,foot --working-directory /home/yusqohid/Dev/
bind=SUPER,b,spawn,firefox
bind=SUPER,e,spawn,env XDG_CURRENT_DESKTOP=kde dolphin

bind=SUPER+ALT,a, spawn,~/.local/bin/toggle_waybar.sh
bind=SUPER+ALT,w,spawn,~/.config/rofi/wallpaper-picker.sh
bind=SUPER+ALT,v,spawn,~/.local/bin/cliphist-rofi
bind=ALT,F4,spawn,~/.config/rofi/powermenu.sh
# exit
bind=SUPER,m,quit
bind=SUPER,q,killclient,

# switch window focus
bind=SUPER,Tab,focusstack,next
bind=SUPER,h,focusdir,left
bind=SUPER,l,focusdir,right
bind=SUPER,k,focusdir,up
bind=SUPER,j,focusdir,down

# swap window
bind=SUPER+CTRL,Up,exchange_client,up
bind=SUPER+CTRL,Down,exchange_client,down
bind=SUPER+CTRL,Left,exchange_client,left
bind=SUPER+CTRL,Right,exchange_client,right

# switch window status
bind=SUPER,g,toggleglobal,
bind=ALT,Tab,toggleoverview,
bind=ALT,backslash,togglefloating,
bind=SUPER,f,togglemaximizescreen,
bind=SUPER+SHIFT,f,togglefullscreen,
bind=ALT+SHIFT,f,togglefakefullscreen,
bind=SUPER,i,minimized,
bind=SUPER,o,toggleoverlay,
bind=SUPER+SHIFT,I,restore_minimized
bind=ALT,z,toggle_scratchpad

# scroller layout
bind=ALT,e,set_proportion,1.0
bind=ALT,x,switch_proportion_preset,
bind=SUPER,c,centerwin

# switch layout
bind=SUPER,n,switch_layout
bind=SUPER,t,setlayout,tile
bind=SUPER,s,setlayout,scroller
# tag switch
bind=SUPER,Left,viewtoleft,0
bind=SUPER,Right,viewtoright,0
# bind=CTRL,Left,viewtoleft_have_client,0
# bind=CTRL,Right,viewtoright_have_client,0
# bind=CTRL+SUPER,Left,tagtoleft,0
# bind=CTRL+SUPER,Right,tagtoright,0

bind=SUPER,1,view,1,0
bind=SUPER,2,view,2,0
bind=SUPER,3,view,3,0
bind=SUPER,4,view,4,0
bind=SUPER,5,view,5,0
bind=SUPER,6,view,6,0
bind=SUPER,7,view,7,0
bind=SUPER,8,view,8,0
bind=SUPER,9,view,9,0

# monitor switch
bind=SUPER+shift,Up,focusmon,up
bind=SUPER+shift,Down,focusmon,down
bind=SUPER+shift,Left,focusmon,left
bind=SUPER+shift,Right,focusmon,right
bind=SUPER+Alt,Left,tagmon,left
bind=SUPER+Alt,Right,tagmon,right
bind=SUPER+Alt,Up,tagmon,up
bind=SUPER+Alt,Down,tagmon,down

# gaps
bind=ALT+SHIFT,X,incgaps,1
bind=ALT+SHIFT,Z,incgaps,-1
bind=ALT+SHIFT,R,togglegaps

# movewin
bind=SUPER+CTRL+SHIFT,Up,movewin,+0,-50
bind=SUPER+CTRL+SHIFT,Down,movewin,+0,+50
bind=SUPER+CTRL+SHIFT,Left,movewin,-50,+0
bind=SUPER+CTRL+SHIFT,Right,movewin,+50,+0

# resizewin
bind=SUPER+SHIFT,minus,resizewin,+0,-100
bind=SUPER+SHIFT,equal,resizewin,+0,+100
bind=SUPER,minus,resizewin,-100,+0
bind=SUPER,equal,resizewin,+100,+0

# Mouse Button Bindings
# NONE mode key only work in ov mode
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=NONE,btn_middle,togglemaximizescreen,0
mousebind=SUPER,btn_right,moveresize,curresize
mousebind=NONE,btn_left,toggleoverview,1
mousebind=NONE,btn_right,killclient,0

# Axis Bindings
axisbind=SUPER,UP,viewtoleft_have_client

axisbind=SUPER,DOWN,viewtoright_have_client
# --- Media Keys (Volume & Brightness) ---
# Mod key 'none' digunakan agar tombol XF86 langsung berfungsi tanpa menekan Super/Alt

# Audio Control (Pipewire/wpctl)
bind=none,XF86AudioRaiseVolume,spawn,wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+ -l 1.0
bind=none,XF86AudioLowerVolume,spawn,wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind=none,XF86AudioMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind=none,XF86AudioMicMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

# Media Player Control (playerctl)
bind=none,XF86AudioPlay,spawn,playerctl play-pause
bind=none,XF86AudioStop,spawn,playerctl stop
bind=none,XF86AudioPrev,spawn,playerctl previous
bind=none,XF86AudioNext,spawn,playerctl next

# Brightness Control (brightnessctl)
bind=none,XF86MonBrightnessUp,spawn,brightnessctl set +10%
bind=none,XF86MonBrightnessDown,spawn,brightnessctl set 10%-
