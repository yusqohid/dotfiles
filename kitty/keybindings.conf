# ================================
#    Kitty Useful Keybindings
# ================================

# ✅ Resize splits
map super+ctrl+shift+left resize_window narrower
map super+ctrl+shift+right resize_window wider
map super+ctrl+shift+up resize_window taller
map super+ctrl+shift+down resize_window shorter

# ✅ New Tab
map ctrl+shift+t new_tab

# ✅ Next Tab
map ctrl+shift+] next_tab

# ✅ Previous Tab
map ctrl+shift+[ previous_tab

# ✅ Close Tab
map ctrl+shift+w close_tab

# ✅ Rename Tab
map ctrl+shift+r set_tab_title

# ✅ Scroll Up & Down by Page
map ctrl+shift+page_up scroll_page_up
map ctrl+shift+page_down scroll_page_down

# ✅ Paste from clipboard
map ctrl+shift+v paste_from_clipboard

# ✅ Copy to clipboard (selection must be made)
map ctrl+shift+c copy_to_clipboard

# ✅ Clear scrollback buffer
map ctrl+shift+k clear_scrollback

# ✅ Open URL hints
map ctrl+shift+u launch --type=overlay kitten hints --type=Url

map ctrl+shift+m launch tmux

# ================================
#    End of Keybinding Config
# ================================

